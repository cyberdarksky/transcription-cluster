[project]
name = "transcription-worker"
version = "1.0.0"
description = "MLX / faster-whisper worker agent for Apple Silicon"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mlx-whisper==0.4.2",
    "mlx==0.22.1",
    "httpx==0.27.2",
    "websockets==12.0",
    "zeroconf==0.131.0",
    "psutil==6.1.0",
    "aiofiles==24.1.0",
    "python-json-logger==2.0.7",
    "pydantic==2.11.5",
    "pydantic-settings==2.7.1",
]

[project.optional-dependencies]
fallback = [
    "faster-whisper>=1.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.black]
line-length = 100
target-version = ["py311"]
